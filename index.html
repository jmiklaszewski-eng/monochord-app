<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>MONOCHORD IMMERSYJNY</title>
    <style>
        :root { --bg: #f4f4f4; --text: #000; --sidebar-w: 420px; }
        body { margin: 0; overflow: hidden; background-color: var(--bg); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: var(--text); user-select: none; }
        
        #gui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #header { position: absolute; top: 20px; left: 30px; pointer-events: auto; border-left: 5px solid #000; padding-left: 15px; }
        h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #000; }
        
        /* PRZYCISK RESET - PRAWY GÓRNY RÓG */
        #reset-btn { 
            position: absolute; 
            top: 20px; 
            right: 30px; 
            pointer-events: auto; 
            font-size: 11px; 
            font-weight: 800; 
            text-transform: uppercase; 
            cursor: pointer; 
            border-bottom: 2px solid #000; 
            padding-bottom: 2px; 
            letter-spacing: 1px; 
            z-index: 100;
        }
        #reset-btn:hover { color: #666; border-color: #666; }

        #menu { position: absolute; top: 70px; left: 30px; width: 230px; pointer-events: auto; display: flex; flex-direction: column; gap: 12px; }
        .section { display: flex; flex-direction: column; gap: 2px; }
        .sec-title { font-size: 9px; font-weight: 800; color: #000; text-transform: uppercase; margin-bottom: 3px; border-bottom: 1px solid #000; padding-bottom: 2px; }
        
        button { background: transparent; border: none; border-radius: 0; padding: 2px 0; width: 100%; font-family: inherit; font-size: 10px; font-weight: 600; color: #000; cursor: pointer; text-align: left; transition: color 0.1s; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; }
        button:hover { color: #666; transform: none; }
        button.active { font-weight: 800; }
        button.looping { font-weight: 800; }
        
        .dot { width: 6px; height: 6px; border-radius: 50%; background: #ccc; transition: background 0.2s; }
        button.active .dot, button.looping .dot { background: #000; box-shadow: none; }
        
        #sidebar { position: absolute; top: 80px; right: 40px; width: var(--sidebar-w); pointer-events: auto; text-align: right; display: none; }
        #side-title { font-size: 24px; font-weight: 800; text-transform: uppercase; color: #000; margin-bottom: 5px; border-bottom: 2px solid #000; padding-bottom: 5px; display: inline-block; }
        #side-desc { font-size: 11px; line-height: 1.6; color: #000; white-space: pre-line; text-align: right; margin-top: 5px; font-weight: 500; }

        #footer {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    width: 100%;
}
#footer img {
    max-width: 80px;
    height: auto;
}
#footer p {
    font-size: 9px;
    color: #666;
    margin: 0;
    font-weight: 600;
    max-width: 350px;
    text-align: left;
    text-transform: none;
}
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="gui">
        <div id="reset-btn">RESET</div>
        
        <div id="header">
            <h1>MONOCHORD IMMERSYJNY</h1>
        </div>

        <div id="menu">
            <div class="section">
                <div class="sec-title">Architektura</div>
                <button id="btn-walls">Bryła Kabiny <div class="dot"></div></button>
                <button id="btn-floor" class="active">Podłoga <div class="dot"></div></button>
                <button id="btn-seatview">Widok z Fotela <div class="dot"></div></button>
                <button id="btn-outview">Widok z Zewnątrz <div class="dot"></div></button>
            </div>
            <div class="section">
                <div class="sec-title">Wyposażenie</div>
                <button id="btn-rack" class="active">Rack Produkcyjny <div class="dot"></div></button>
                <button id="btn-panels" class="active">Panele Akustyczne <div class="dot"></div></button>
                <button id="btn-diffuser" class="active">Dyfuzor QRD <div class="dot"></div></button>
                <button id="btn-trackers" class="active">OptiTrack (Inside) <div class="dot"></div></button>
                <button id="btn-chair" class="active">Fotel <div class="dot"></div></button>
                <button id="btn-vr" class="active">Gogle VR <div class="dot"></div></button>
            </div>
            <div class="section">
                <div class="sec-title">Strefy Emisji</div>
                <button class="zone" data-id="zenit">Zenit High <div class="dot"></div></button>
                <button class="zone" data-id="sky">Sky Layer <div class="dot"></div></button>
                <button class="zone" data-id="main">Ear-Level <div class="dot"></div></button>
                <button class="zone" data-id="ground">Ground / WFS <div class="dot"></div></button>
                <button class="zone" data-id="nadir">Nadir DBA <div class="dot"></div></button>
            </div>
            <div class="section">
                <div class="sec-title">Symulacja Audio (Wizualna)</div>
                <button class="sim" id="btn-heli">Helikopter Scan <div class="dot"></div></button>
                <button class="sim" id="btn-city">City Traffic <div class="dot"></div></button>
                <button class="sim" id="btn-chaos">Stress Test <div class="dot"></div></button>
            </div>
        </div>

        <div id="sidebar">
            <div id="side-title">ELEMENT</div>
            <div id="side-desc">OPIS</div>
        </div>

        <div id="footer">
            <img src="logo.png" alt="Logo">
            <p>„Przedsięwzięcie sfinansowane przez Unię Europejską NextGenerationEU w ramach programu Krajowego Planu Odbudowy”</p>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        let aCtx;
        const initA = () => { if (!aCtx) aCtx = new (window.AudioContext || window.webkitAudioContext)(); };
        const playT = (f, t, d, v) => {
            if (!aCtx) return;
            const o = aCtx.createOscillator(); const g = aCtx.createGain();
            o.type = t; o.frequency.setValueAtTime(f, aCtx.currentTime);
            g.gain.setValueAtTime(v, aCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, aCtx.currentTime + d);
            o.connect(g); g.connect(aCtx.destination); o.start(); o.stop(aCtx.currentTime + d);
        };
        const playN = (d, v, f) => {
            if (!aCtx) return;
            const b = aCtx.createBuffer(1, aCtx.sampleRate * d, aCtx.sampleRate);
            const dt = b.getChannelData(0); for (let i = 0; i < dt.length; i++) dt[i] = Math.random() * 2 - 1;
            const s = aCtx.createBufferSource(); s.buffer = b;
            const fl = aCtx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = f;
            const g = aCtx.createGain(); g.gain.setValueAtTime(v, aCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, aCtx.currentTime + d);
            s.connect(fl); fl.connect(g); g.connect(aCtx.destination); s.start();
        };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf4f4f4); 
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth/window.innerHeight, 1, 10000);
        const startCamPos = new THREE.Vector3(1100, 800, 1100);
        camera.position.copy(startCamPos);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha:true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.8;
        controls.enableZoom = true; 

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const dir1 = new THREE.DirectionalLight(0xffffff, 0.7); dir1.position.set(500,1000,500); scene.add(dir1);

        const specs = {
            zenit: { name: "Genelec 8341A SAM™", desc: "Top Channel (Zenit).\nPasmo: 38 Hz - 37 kHz.\nTechnologia Coaxial Point Source.\nPrecyzyjna lokalizacja w osi pionowej.", freq: 880 },
            sky: { name: "Genelec 8331A SAM™", desc: "Warstwa Sky Layer (Height Channel).\nPasmo: 45 Hz - 37 kHz.\nNajbardziej kompaktowy monitor trójdrożny The Ones™.\nZastosowanie: Atmos / Auro-3D.", freq: 660 },
            main: { name: "Genelec 8351B SAM™", desc: "Ear-Level (Main Ring).\nPasmo: 32 Hz - 43 kHz.\nReferencyjny monitor koaksjalny o wysokiej dynamice.\nOptymalizacja GLM™ dla Sweet Spot.", freq: 440 },
            ground: { name: "Genelec 8320A SAM™", desc: "Warstwa Ground / WFS.\nPasmo: 55 Hz - 23 kHz.\nMonitor pola bliskiego sterowany DSP.\nZastosowanie: Wave Field Synthesis i efekty dolne.", freq: 220 },
            nadir: { name: "Genelec 7380A SAM™", desc: "Nadir DBA Subwoofer.\nPasmo: 16 Hz - 100 Hz.\nPrzetwornik 15 cali, wzmacniacz 800W.\nKontrola modów Double Bass Array.", freq: 60 }
        };

        let wallMesh;
        const objText = `v -170 -260 86.1522\nv -300 -130 140\nv -430 0 86.1522\nv -430 0 0\nv -430 0 -86.1522\nv -300 -130 -140\nv -170 -260 -86.1522\nf 1 2 3 4 5 6 7\nv 170 -260 86.1522\nv 300 -130 140\nv 170 0 193.848\nv -170 0 193.848\nf 8 9 10 11 2 1\nv 430 0 86.1522\nv 430 0 0\nv 430 0 -86.1522\nv 300 -130 -140\nv 170 -260 -86.1522\nf 8 9 12 13 14 15 16\nv 300 130 140\nf 12 9 10 17\nv -300 130 140\nv -170 260 86.1522\nv 170 260 86.1522\nf 11 18 19 20 17 10\nf 11 18 3 2\nv -170 260 -86.1522\nv -300 130 -140\nf 3 18 19 21 22 5 4\nv 170 260 -86.1522\nf 23 21 19 20\nv 300 130 -140\nv 170 0 -193.848\nv -170 0 -193.848\nf 23 24 25 26 22 21\nf 12 17 20 23 24 14 13\nf 14 24 25 15\nf 7 6 26 25 15 16\nf 5 22 26 6\nf 16 7 1 8`;
        const loader = new OBJLoader();
        loader.load(URL.createObjectURL(new Blob([objText], {type:'text/plain'})), (obj) => {
            obj.traverse(child => {
                if(child.isMesh) {
                    child.geometry.rotateX(-Math.PI/2); child.geometry.rotateY(Math.PI/2);
                    child.material = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.1, roughness: 0.8, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
                    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(child.geometry), new THREE.LineBasicMaterial({color:0x000000}));
                    scene.add(edges); 
                    wallMesh = child; wallMesh.visible = false; 
                    wallMesh.userData.ignore = true;
                }
            });
            scene.add(obj);
        });

        const h = 15; 
        const lowH = h + 37;
        const interactive = []; const panels = [];

        const grid = new THREE.Group();
        const gridM = new THREE.MeshStandardMaterial({color: 0x666666});
        for(let i=-100; i<=100; i+=10) { const b=new THREE.Mesh(new THREE.BoxGeometry(1.2,5,400),gridM); b.position.x=i; grid.add(b); }
        for(let j=-200; j<=200; j+=10) { const b=new THREE.Mesh(new THREE.BoxGeometry(200,5,1.2),gridM); b.position.z=j; grid.add(b); }
        grid.position.y = -123 + h; grid.userData = { title: "Podłoga Techniczna", desc: "Ażurowa platforma stalowa (Grid).\nNośność: 500 kg/m².\nZapewnia pełną transparentność akustyczną dla subwooferów DBA umieszczonych poniżej." };
        scene.add(grid); interactive.push(grid);

        const rack = new THREE.Mesh(new THREE.BoxGeometry(40,100,40), new THREE.MeshStandardMaterial({color:0x222222}));
        rack.position.set(0, -70 + h, 350); 
        rack.userData = { 
            title: "Rack Produkcyjny (Mastering Grade)", 
            desc: "Sercem studia jest zaawansowany system przetwarzania audio:\n\n• SYSTEM CORE: Trinnov Altitude 32 (64-ch, 24bit/192kHz) z technologią 3D Loudspeaker Remapping.\n• INTERFACE: Antelope Galaxy 64 Synergy Core (Dante/HDX/Thunderbolt, 133dB DNR).\n• PREAMPS A: Millennia HV-3D-8 (Transformerless Class-A, dla nagrań klasycznych).\n• PREAMPS B: Rupert Neve Designs 5024 (Custom Transformers, z kontrolą Silk Texture).\n• CLOCK: Antelope 10M Atomic Clock (Rubidium, 0.03 ppb).\n• POWER: Furman IT-Reference 16Ei (Discrete Symmetrical Power)." 
        };
        scene.add(rack); interactive.push(rack);

        const diffuser = new THREE.Mesh(new THREE.BoxGeometry(70,70,15), new THREE.MeshStandardMaterial({color:0x444444}));
        diffuser.position.set(0, 0+h, -350); 
        diffuser.userData = { 
            title: "Dyfuzor QRD 2D", 
            desc: "Vicoustic Multifuser DC3.\nTyp: Dwuwymiarowy dyfuzor typu Quadratic Residue.\nZakres działania: 470 Hz – 10 kHz.\nFunkcja: Rozpraszanie fazowe fal, eliminacja echa trzepoczącego (flutter echo) przy zachowaniu żywotności akustycznej pomieszczenia." 
        };
        scene.add(diffuser); interactive.push(diffuser);

        const mkP = (x,z,t) => {
            const p = new THREE.Mesh(new THREE.BoxGeometry(5,130,140), new THREE.MeshStandardMaterial({color:0x555555}));
            p.position.set(x, 0+h, z); 
            p.userData = { 
                title: t, 
                desc: "Absorber szerokopasmowy Heavy Duty.\nGęstość rdzenia: 80 kg/m³ (Wełna mineralna skalna).\nKlasa absorpcji: A (NRC 1.10).\nOgnioodporność: Euroclass A1.\nZastosowanie: Kontrola czasu pogłosu (RT60) w zakresie niskiego środka (125-500Hz)." 
            };
            scene.add(p); interactive.push(p); panels.push(p);
        };
        mkP(-240, 0, "Absorber Boczny L"); mkP(240, 0, "Absorber Boczny P");

        const chair = new THREE.Group();
        chair.add(new THREE.Mesh(new THREE.BoxGeometry(40,10,40), new THREE.MeshStandardMaterial({color:0x111111})));
        chair.position.y = -50+h;
        chair.userData = { 
            title: "Fotel Ergonomiczny", 
            desc: "Model: Ergohuman Plus Elite (Mesh).\n• Materiał: Oddychająca siatka (Mesh) minimalizująca odbicia akustyczne.\n• Regulacja: 5D (Zagłówek, Lędźwia, Podłokietniki, Kąt, Wysokość).\n• Baza: Polerowane aluminium, kółka ciche do podłóg twardych." 
        };
        scene.add(chair); interactive.push(chair);

        const headGroup = new THREE.Group();
        chair.add(headGroup);
        const dummy = new THREE.Mesh(new THREE.SphereGeometry(12,32,32), new THREE.MeshStandardMaterial({color:0xffff00}));
        dummy.position.y = 40; headGroup.add(dummy); 
        const eyeGeo = new THREE.SphereGeometry(1.5, 16, 16); const eyeMat = new THREE.MeshBasicMaterial({color:0x000000});
        const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-4, 42, 10);
        const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set(4, 42, 10);
        headGroup.add(eyeL, eyeR);
        const smileGeo = new THREE.TorusGeometry(3, 0.5, 16, 16, Math.PI); 
        const smile = new THREE.Mesh(smileGeo, new THREE.MeshBasicMaterial({color:0x000000}));
        smile.position.set(0, 36, 10.5); smile.rotation.z = Math.PI; headGroup.add(smile);
        
        const vrGroup = new THREE.Group();
        const vrMat = new THREE.MeshStandardMaterial({color:0xcc4400, roughness: 0.7, metalness: 0.1});
        const housing = new THREE.Mesh(new THREE.BoxGeometry(16, 8, 10), vrMat);
        const facePlate = new THREE.Mesh(new THREE.BoxGeometry(16.5, 7, 1), new THREE.MeshStandardMaterial({color:0xaa3300})); facePlate.position.z = 5.2;
        const strap = new THREE.Mesh(new THREE.TorusGeometry(8, 0.6, 8, 24), new THREE.MeshBasicMaterial({color:0x111111})); strap.rotation.x = Math.PI/2;
        vrGroup.add(housing, facePlate, strap);
        vrGroup.position.set(0, 40, 10); headGroup.add(vrGroup);
        
        housing.userData = { 
            title: "System VR / XR", 
            desc: "• Gogle: Varjo XR-4 Focal Edition.\n• Rozdzielczość: 51 PPD (Retina resolution), 4K na oko.\n• Passthrough: Kamery 20 Mpx (Mixed Reality).\n• Eye Tracking: 200 Hz z foveated rendering.\n• Kontrolery: Manus Prime X Haptic Gloves (Fizyczny feedback)." 
        };
        interactive.push(housing);

        const trackers = new THREE.Group();
        const trkGeo = new THREE.BoxGeometry(10,10,10); 
        const trkMat = new THREE.MeshStandardMaterial({color:0xcc4400, roughness: 0.7});
        const lensGeo = new THREE.CircleGeometry(3.5, 32); 
        const lensMat = new THREE.MeshBasicMaterial({color:0x000000});
        function mkTrk(x,y,z) { 
            const tGroup = new THREE.Group();
            tGroup.position.set(x,y,z); tGroup.lookAt(0,0,0);
            const body = new THREE.Mesh(trkGeo, trkMat);
            const lens = new THREE.Mesh(lensGeo, lensMat); lens.position.z = 5.1;
            tGroup.add(body, lens);
            body.userData = { 
                title: "Kamera OptiTrack PrimeX 13", 
                desc: "• Typ: Wysokoobrotowa kamera Motion Capture.\n• Rozdzielczość: 1.3 MP (do 240 FPS).\n• Latencja: Systemowa < 4.2ms.\n• Zastosowanie: Precyzyjne śledzenie 6DoF instrumentów i ciała w przestrzeni VR/XR." 
            }; 
            interactive.push(body); trackers.add(tGroup);
        }
        mkTrk(-190, 80, -190); mkTrk(190, 80, -190); mkTrk(-190, 80, 190); mkTrk(190, 80, 190);
        scene.add(trackers);

        const speakers = []; const groups = { zenit:[], sky:[], main:[], ground:[], nadir:[] };
        const loops = { zenit:false, sky:false, main:false, ground:false, nadir:false };
        function mkSpk(x,y,z,color,id,label, isLow = false) {
            const g = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(16,22,16), new THREE.MeshStandardMaterial({color:0x999999}));
            const cone = new THREE.Mesh(new THREE.CircleGeometry(7,32), new THREE.MeshBasicMaterial({color:0x222222})); cone.position.z=8.1; g.add(body, cone); 
            const curY = isLow ? y + lowH : y + h;
            g.position.set(x, curY, z); g.lookAt(0, h, 0);
            const sp = specs[id];
            const info = { title: label + ": " + sp.name, desc: sp.desc };
            g.userData = info; body.userData = info; cone.userData = info;
            scene.add(g); interactive.push(g, body, cone);
            const ds = {mesh:cone, pos:new THREE.Vector3(x, curY, z), group:id, cd:0, color: new THREE.Color(color)};
            speakers.push(ds); groups[id].push(ds);
        }
        mkSpk(0, 160, 0, 0xff8800, 'zenit', "Monitor");
        for(let i=0; i<8; i++){ let a=i/8*Math.PI*2+Math.PI/8; mkSpk(Math.sin(a)*140, 110, Math.cos(a)*140, 0xffaa00, 'sky', "Sky Monitor"); }
        for(let i=0; i<12; i++){ let a=i/12*Math.PI*2; mkSpk(Math.sin(a)*220, 0, Math.cos(a)*280, 0x00cc44, 'main', "Main Monitor"); }
        for(let i=0; i<8; i++){ let a=i/8*Math.PI*2; mkSpk(Math.sin(a)*130, -180, Math.cos(a)*160, 0x0066ff, 'ground', "Ground Monitor", true); }
        mkSpk(0,-200,-100, 0xcc00ff, 'nadir', "Sub DBA Front", true); mkSpk(0,-200,100, 0xcc00ff, 'nadir', "Sub DBA Rear", true);

        const waves = []; const headPos = new THREE.Vector3(0, h, 0);
        function fire(s) {
            if(s.cd > 0) return; s.cd = 6; 
            if(aCtx) { const sp = specs[s.group]; playT(sp.freq, 'sine', 0.1, 0.05); } 
            const m = new THREE.Mesh(new THREE.TorusGeometry(2, 0.4, 16, 40), new THREE.MeshBasicMaterial({ color: s.color, transparent: true, opacity: 0.7 }));
            m.position.copy(s.pos); m.lookAt(headPos); scene.add(m);
            waves.push({ m:m, start:s.pos.clone(), p:0, spd: 0.012 });
        }

        // UKRYTO MYSZKĘ POZA EKRAN NA START
        const ray = new THREE.Raycaster(); const mouse = new THREE.Vector2(-1000, -1000);
        const side = document.getElementById('sidebar'), sT = document.getElementById('side-title'), sD = document.getElementById('side-desc');
        let pinnedObject = null; let isHovering = false;

        window.addEventListener('mousemove', (e) => { 
            mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1; 
        });

        window.addEventListener('mousedown', () => {
            if(seatView || (wallMesh && wallMesh.visible)) return;
            ray.setFromCamera(mouse, camera);
            const hits = ray.intersectObjects(interactive, true);
            let validHit = null;
            for(let i = 0; i < hits.length; i++) {
                let t = hits[i].object;
                let vis = true, p = t;
                while(p) { if(p.visible===false) { vis=false; break; } p = p.parent; }
                if(!vis) continue;

                p = t;
                while(p && !p.userData.title) p = p.parent;
                if(p && p.userData.title) { validHit = p; break; }
            }
            if(validHit) {
                pinnedObject = validHit; side.style.display='block';
                sT.innerText=validHit.userData.title; sD.innerText=validHit.userData.desc;
            } else { pinnedObject = null; side.style.display='none'; }
        });

        function stopZones() {
            Object.keys(loops).forEach(k => loops[k] = false);
            document.querySelectorAll('.zone').forEach(b => b.classList.remove('looping'));
        }

        document.querySelectorAll('.zone').forEach(b => { 
            b.onclick = () => { initA(); const id=b.getAttribute('data-id'); loops[id]=!loops[id]; b.classList.toggle('looping'); }; 
        });

        let mode=null, prog=0;
        document.getElementById('btn-heli').onclick = function() { initA(); stopZones(); mode=mode==='heli'?null:'heli'; this.classList.toggle('active'); document.getElementById('btn-chaos').classList.remove('active'); document.getElementById('btn-city').classList.remove('active'); };
        document.getElementById('btn-chaos').onclick = function() { initA(); stopZones(); mode=mode==='chaos'?null:'chaos'; this.classList.toggle('active'); document.getElementById('btn-heli').classList.remove('active'); document.getElementById('btn-city').classList.remove('active'); };
        document.getElementById('btn-city').onclick = function() { initA(); stopZones(); mode=mode==='city'?null:'city'; this.classList.toggle('active'); document.getElementById('btn-heli').classList.remove('active'); document.getElementById('btn-chaos').classList.remove('active'); };

        document.getElementById('btn-walls').onclick = function() { wallMesh.visible=!wallMesh.visible; this.classList.toggle('active'); if(wallMesh.visible) { side.style.display='none'; pinnedObject=null; } };
        document.getElementById('btn-floor').onclick = function() { grid.visible=!grid.visible; this.classList.toggle('active'); };
        document.getElementById('btn-rack').onclick = function() { rack.visible=!rack.visible; this.classList.toggle('active'); };
        document.getElementById('btn-trackers').onclick = function() { trackers.visible=!trackers.visible; this.classList.toggle('active'); };
        document.getElementById('btn-diffuser').onclick = function() { diffuser.visible=!diffuser.visible; this.classList.toggle('active'); };
        document.getElementById('btn-panels').onclick = function() { panels.forEach(p=>p.visible=!p.visible); this.classList.toggle('active'); };
        document.getElementById('btn-chair').onclick = function() { chair.visible=!chair.visible; this.classList.toggle('active'); };
        
        let vrEnabled = true;
        document.getElementById('btn-vr').onclick = function() { vrEnabled = !vrEnabled; vrGroup.visible = vrEnabled; this.classList.toggle('active'); };

        let seatView = false;
        document.getElementById('btn-seatview').onclick = function() {
            seatView = !seatView; this.classList.toggle('active');
            document.getElementById('btn-outview').classList.remove('active');
            if(seatView) { 
                if(!wallMesh.visible) { wallMesh.visible = true; document.getElementById('btn-walls').classList.add('active'); }
                camera.fov = 60; camera.updateProjectionMatrix();
                controls.target.set(0, h, 0); camera.position.set(0, h, 5); 
                side.style.display='none'; pinnedObject=null;
            } else { 
                camera.fov = 35; camera.updateProjectionMatrix(); camera.position.copy(startCamPos); 
            }
        };

        document.getElementById('btn-outview').onclick = function() {
            seatView = false; camera.fov = 35; camera.updateProjectionMatrix();
            document.getElementById('btn-seatview').classList.remove('active');
            this.classList.toggle('active'); controls.target.set(0,0,0); camera.position.set(2000, 1500, 2000);
        };

        document.getElementById('reset-btn').onclick = function() {
            seatView = false; document.getElementById('btn-seatview').classList.remove('active');
            document.getElementById('btn-outview').classList.remove('active');
            camera.fov = 35; camera.updateProjectionMatrix();
            camera.position.copy(startCamPos); controls.target.set(0,0,0);
            wallMesh.visible = false; document.getElementById('btn-walls').classList.remove('active');
            grid.visible = true; document.getElementById('btn-floor').classList.add('active');
            rack.visible = true; document.getElementById('btn-rack').classList.add('active');
            panels.forEach(p=>p.visible=true); document.getElementById('btn-panels').classList.add('active');
            vrEnabled = true; vrGroup.visible = true; document.getElementById('btn-vr').classList.add('active');
            mode = null; stopZones();
            document.querySelectorAll('.sim').forEach(b => b.classList.remove('active'));
            pinnedObject = null; side.style.display='none';
        };

        function animate() {
            requestAnimationFrame(animate); 
            
            // --- SKANOWANIE OBIEKTÓW CO KLATKĘ ---
            if(seatView || (wallMesh && wallMesh.visible)) {
                 side.style.display='none';
                 document.body.style.cursor = 'default';
                 isHovering = false;
            } else {
                ray.setFromCamera(mouse, camera);
                const hits = ray.intersectObjects(interactive, true);
                
                let validHit = null;
                for(let i = 0; i < hits.length; i++) {
                    let t = hits[i].object;
                    let vis = true, p = t;
                    while(p) { if(p.visible===false) { vis=false; break; } p = p.parent; }
                    if(!vis) continue;

                    p = t;
                    while(p && !p.userData.title) p = p.parent;
                    if(p && p.userData.title) { validHit = p; break; }
                }

                isHovering = (validHit !== null);

                if(!pinnedObject) {
                    if(validHit) {
                        document.body.style.cursor = 'pointer';
                        side.style.display = 'block';
                        sT.innerText = validHit.userData.title;
                        sD.innerText = validHit.userData.desc;
                    } else { 
                        document.body.style.cursor = 'default'; 
                        side.style.display = 'none'; 
                    }
                } else {
                    document.body.style.cursor = validHit ? 'pointer' : 'default';
                }
            }

            // AUTO-OBRÓT ZATRZYMUJE SIĘ PODCZAS HOVERA
            controls.autoRotate = !pinnedObject && !mode && !seatView && !isHovering;
            controls.update();

            const dist = camera.position.distanceTo(new THREE.Vector3(0, h, 0));
            headGroup.visible = !(seatView && dist < 15); 

            if(mode==='chaos' && Math.random() > 0.8) fire(speakers[Math.floor(Math.random()*speakers.length)]);
            if(mode==='city' && Math.random() > 0.5) { const s = speakers[Math.floor(Math.random()*speakers.length)]; fire(s); if(Math.random()>0.9 && aCtx) playN(0.5, 0.05, 400); }
            if(mode==='heli') { 
                prog += 0.02; const ph = new THREE.Vector3(Math.cos(prog)*180, h+80, Math.sin(prog)*180); 
                speakers.forEach(s => { if(s.pos.distanceTo(ph) < 120) fire(s); }); 
                if(Math.random()>0.9 && aCtx) playN(0.1, 0.05, 300+Math.sin(prog)*100);
            }
            Object.keys(loops).forEach(k => { if(loops[k] && Math.random()>0.8) fire(groups[k][Math.floor(Math.random()*groups[k].length)]); });

            for(let i=waves.length-1; i>=0; i--) {
                const w = waves[i]; w.p += w.spd; if(w.p >= 1) { scene.remove(w.m); waves.splice(i,1); continue; }
                w.m.position.lerpVectors(w.start, headPos, w.p); w.m.scale.setScalar(1 + w.p * 10); w.m.material.opacity = (1 - w.p) * 0.7;
            }
            speakers.forEach(s => { if(s.cd > 0) s.cd--; });
            renderer.render(scene, camera);
        }
        animate();
        window.onresize=()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);}
    </script>
</body>
</html>
